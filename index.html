<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON ($AXN) — Presale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a12;
    --bg-panel:#12121e;
    --bg-panel-2:#171726;
    --line:#26263a;
    --signal:#8b7fff;
    --signal-2:#5ee6c8;
    --pulse:#ff3d71;
    --text:#eceaf6;
    --text-dim:#8a89a3;
    --text-dimmer:#54536b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}

  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.25;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
  }

  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}

  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;position:relative;z-index:10;
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:0.02em;}
  .logo .node{
    width:10px;height:10px;border-radius:50%;background:var(--signal);
    box-shadow:0 0 12px 2px var(--signal);
  }
  .nav-links{display:flex;gap:28px;font-size:14px;color:var(--text-dim);}
  .nav-links a:hover{color:var(--text);}
  
  .nav-actions{display:flex;align-items:center;gap:12px;}
  .doc-btn{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text-dim);
    font-weight:600;font-size:13px;padding:9px 14px;border-radius:8px;transition:all .15s ease;
  }
  .doc-btn:hover{border-color:var(--signal);color:var(--text);}

  .nav-cta{
    background:var(--signal);color:#0a0a12;font-weight:600;font-size:14px;
    padding:10px 18px;border-radius:8px;
  }

  .hero{padding:96px 24px 64px;text-align:center;position:relative;z-index:1;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--bg-panel);
    padding:6px 14px;border-radius:999px;font-size:12px;color:var(--text-dim);
    margin-bottom:28px;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--signal-2);box-shadow:0 0 8px var(--signal-2);}
  h1.hero-title{
    font-size:clamp(36px,7vw,68px);font-weight:700;line-height:1.05;letter-spacing:-0.02em;
    margin-bottom:20px;
  }
  h1.hero-title .grad{
    background:linear-gradient(90deg,var(--signal),var(--signal-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-sub{max-width:560px;margin:0 auto 40px;color:var(--text-dim);font-size:17px;}

  /* Contract Address Bar */
  .contract-bar-wrap{
    max-width:720px;margin:0 auto 40px;position:relative;z-index:5;
  }
  .contract-bar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 18px;gap:12px;
  }
  .contract-info{display:flex;align-items:center;gap:12px;overflow:hidden;}
  .contract-label{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--signal-2);background:rgba(94,230,200,0.1);padding:4px 8px;border-radius:6px;white-space:nowrap;
  }
  .contract-address{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .copy-btn{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text-dim);
    font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;
    white-space:nowrap;transition:all .15s ease;display:flex;align-items:center;gap:6px;
  }
  .copy-btn:hover{border-color:var(--signal);color:var(--text);}
  .copy-btn.copied{border-color:var(--signal-2);color:var(--signal-2);background:rgba(94,230,200,0.08);}

  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    max-width:960px;margin:0 auto 80px;position:relative;z-index:1;
  }
  .stat{background:var(--bg-panel);padding:22px 12px;text-align:center;}
  .stat .val{font-size:18px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--signal-2);white-space:nowrap;}
  .stat .lbl{font-size:11px;color:var(--text-dimmer);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}

  .section{padding:64px 24px;position:relative;z-index:1;}
  .section-head{text-align:center;max-width:520px;margin:0 auto 40px;}
  .section-head .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal-2);margin-bottom:10px;}
  .section-head h2{font-size:clamp(26px,4vw,36px);font-weight:700;}
  .section-head p{color:var(--text-dim);margin-top:10px;}

  /* Buy Card */
  .buy-card{
    max-width:480px;margin:0 auto 64px;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;
    padding:28px;position:relative;z-index:5;
  }
  .presale-bar-wrap{margin-bottom:24px;}
  .presale-bar-top{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-bottom:8px;}
  .presale-bar-top .raised{color:var(--signal-2);font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .presale-bar{
    height:12px;border-radius:999px;background:var(--bg-panel-2);border:1px solid var(--line);
    overflow:hidden;position:relative;
  }
  .presale-bar-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--signal),var(--signal-2));
    width:var(--fill,0%);
    transition:width .6s ease;
  }
  .price-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-top:10px;}
  .price-row .mono{color:var(--text);}

  .field-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px;}
  .pay-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .pay-opt{
    border:1px solid var(--line);background:var(--bg-panel-2);border-radius:99px;
    padding:10px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;
    color:var(--text-dim);user-select:none;transition:all .15s ease;
  }
  .pay-opt.active{border-color:var(--signal);color:var(--signal-2);background:rgba(139,127,255,.08);}

  .amount-input{
    display:flex;align-items:center;border:1px solid var(--line);background:var(--bg-panel-2);
    border-radius:10px;padding:14px 16px;margin-top:4px;
  }
  .amount-input input{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:18px;width:100%;
  }
  .amount-input .cur{color:var(--text-dim);font-size:14px;font-weight:600;white-space:nowrap;margin-left:8px;}

  .receive-box{
    margin-top:16px;padding:16px;border-radius:10px;
    background:rgba(94,230,200,.06);border:1px solid rgba(94,230,200,.25);
    display:flex;justify-content:space-between;align-items:center;
  }
  .receive-box .lbl{font-size:12px;color:var(--text-dim);}
  .receive-box .amt{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:var(--signal-2);}

  .buy-btn{
    width:100%;margin-top:20px;padding:16px;border:none;border-radius:10px;
    background:var(--pulse);color:#fff;font-weight:700;font-size:16px;cursor:pointer;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .buy-btn:hover{box-shadow:0 8px 28px -6px rgba(255,61,113,.55);transform:translateY(-1px);}
  .buy-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

  .wallet-connect-row{display:flex;justify-content:center;margin-bottom:16px;}
  .wallet-btn{
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:99px;
    padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;z-index:10;position:relative;
  }
  .wallet-btn:hover{border-color:var(--signal);}
  .wallet-btn.connected{border-color:var(--signal-2);color:var(--signal-2);}
  .wallet-btn .wdot{width:7px;height:7px;border-radius:50%;background:var(--text-dimmer);}
  .wallet-btn.connected .wdot{background:var(--signal-2);box-shadow:0 0 6px var(--signal-2);}

  /* Stages Grid */
  .stages-grid {
    display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:1000px;margin:0 auto;
  }
  .stage-card {
    background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 14px;text-align:center;
  }
  .stage-card.active {
    border-color:var(--signal-2);background:radial-gradient(circle at top, rgba(94, 230, 200, 0.08) 0%, var(--bg-panel) 70%);
  }
  .stage-num {font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
  .stage-card.active .stage-num {color:var(--signal-2);}
  .stage-price {font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;margin-bottom:8px;}
  .stage-status {font-size:10px;padding:3px 8px;border-radius:99px;font-weight:600;text-transform:uppercase;}
  .stage-card.active .stage-status {background:rgba(94, 230, 200, 0.2);color:var(--signal-2);}
  .stage-card.completed .stage-status {background:rgba(139, 127, 255, 0.15);
