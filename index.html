<script>
  console.log("AXON Script initializing...");

  const CONFIG = {
    tokenPriceUsd: 0.001875,
    raisedUsd: 87635,          
    tokensSold: 46,741,333,          
    softBarDenominatorUsd: 1500000,
    rates: { eth: 3400, bnbbsc: 560, usdterc20: 1, maticmainnet: 0.55, usdc: 1 },
    createPaymentEndpoint: "/api/create-payment"
  };

  const CHAINS = {
    eth:          { hex: '0x1', decimals: 18, native: true },
    bnbbsc:       { hex: '0x38', decimals: 18, native: true, addParams: { chainName: 'BNB Smart Chain', nativeCurrency: {name:'BNB', symbol:'BNB', decimals:18}, rpcUrls: ['https://bsc-dataseed.binance.org/'], blockExplorerUrls: ['https://bscscan.com'] } },
    maticmainnet: { hex: '0x89', decimals: 18, native: true, addParams: { chainName: 'Polygon Mainnet', nativeCurrency: {name:'MATIC', symbol:'MATIC', decimals:18}, rpcUrls: ['https://polygon-rpc.com/'], blockExplorerUrls: ['https://polygonscan.com'] } },
    usdterc20:    { hex: '0x1', decimals: 6, native: false, tokenAddress: '0xdAC17F958D2ee523a2206206994597C13D831ec7' },
    usdc:         { hex: '0x1', decimals: 6, native: false, tokenAddress: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48' }
  };

  // Stats setup
  const fillPct = Math.min(100, (CONFIG.raisedUsd / CONFIG.softBarDenominatorUsd) * 100);
  document.getElementById('presaleFill').style.setProperty('--fill', fillPct.toFixed(1) + '%');
  document.getElementById('barRaisedLabel').textContent = '$' + CONFIG.raisedUsd.toLocaleString();
  document.getElementById('barSoldLabel').textContent = CONFIG.tokensSold.toLocaleString() + ' $AXN';
  document.getElementById('statRaised').textContent = '$' + CONFIG.raisedUsd.toLocaleString();
  document.getElementById('statSold').textContent = CONFIG.tokensSold.toLocaleString();

  // Currency Selector
  let selectedTicker = 'eth'; 
  const payOpts = document.querySelectorAll('.pay-opt');
  payOpts.forEach(opt => {
    opt.addEventListener('click', () => {
      payOpts.forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      selectedTicker = opt.dataset.ticker;
      document.getElementById('payCurLabel').textContent = opt.textContent;
      updateReceiveAmount();
    });
  });

  const amountInput = document.getElementById('payAmount');
  const receiveEl = document.getElementById('receiveAmt');
  
  function updateReceiveAmount(){
    const amt = parseFloat(amountInput.value) || 0;
    const usdValue = amt * (CONFIG.rates[selectedTicker] || 0);
    const tokens = usdValue / CONFIG.tokenPriceUsd;
    receiveEl.textContent = tokens.toLocaleString(undefined,{maximumFractionDigits:0}) + ' $AXN';
  }
  amountInput.addEventListener('input', updateReceiveAmount);

  let connectedAccount = null;
  const connectBtn = document.getElementById('connectWalletBtn');

  function updateWalletUI(account) {
    connectedAccount = account;
    if (account) {
      connectBtn.textContent = account.slice(0,6) + '…' + account.slice(-4);
      connectBtn.classList.add('connected');
      if (!connectBtn.querySelector('.wdot')) {
        connectBtn.prepend(Object.assign(document.createElement('span'), {className:'wdot'}));
      }
    } else {
      connectBtn.textContent = 'Connect Wallet';
      connectBtn.classList.remove('connected');
    }
  }

  async function connectWallet() {
    console.log("Connecting wallet requested...");
    if (!window.ethereum) {
      alert("No Web3 wallet detected. Please open this page inside a crypto wallet app (like MetaMask or Trust Wallet browser).");
      return null;
    }
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      updateWalletUI(accounts[0]);
      return accounts[0];
    } catch (err) {
      console.error("Wallet connection error:", err);
      alert('Wallet connection rejected.');
      return null;
    }
  }

  connectBtn.addEventListener('click', connectWallet);

  if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
      updateWalletUI(accounts.length ? accounts[0] : null);
    });
  }

  function toHexWei(amountStr, decimals) {
    let [whole, frac = ''] = String(amountStr).split('.');
    frac = (frac + '0'.repeat(decimals)).slice(0, decimals);
    const combined = (whole + frac).replace(/^0+(?=\d)/, '');
    return '0x' + BigInt(combined || '0').toString(16);
  }

  function buildErc20TransferData(toAddress, amountStr, decimals) {
    const selector = 'a9059cbb';
    const addrPadded = toAddress.replace('0x','').toLowerCase().padStart(64, '0');
    const amountHex = BigInt(toHexWei(amountStr, decimals)).toString(16).padStart(64, '0');
    return '0x' + selector + addrPadded + amountHex;
  }

  async function ensureChain(hexChainId, addParams) {
    const currentChain = await window.ethereum.request({ method: 'eth_chainId' });
    if (currentChain === hexChainId) return;
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: hexChainId }] });
    } catch (switchErr) {
      if (switchErr.code === 4902 && addParams) {
        await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: hexChainId, ...addParams }] });
      } else {
        throw switchErr;
      }
    }
  }

  // Buy Flow with explicit error alerts
  document.getElementById('buyBtn').addEventListener('click', async () => {
    console.log("Buy button clicked!");
    const amt = parseFloat(amountInput.value);
    if (!amt || amt <= 0) { 
      alert('Please enter a valid amount.'); 
      return; 
    }

    const buyBtn = document.getElementById('buyBtn');
    const originalText = buyBtn.textContent;

    try {
      let account = connectedAccount;
      if (!account) {
        buyBtn.textContent = 'Connecting Wallet...';
        account = await connectWallet();
        if (!account) {
          buyBtn.textContent = originalText;
          buyBtn.disabled = false;
          return; 
        }
      }

      buyBtn.textContent = 'Generating Invoice...';
      buyBtn.disabled = true;

      const usdValue = amt * (CONFIG.rates[selectedTicker] || 0);
      
      console.log("Fetching endpoint:", CONFIG.createPaymentEndpoint);
      const res = await fetch(CONFIG.createPaymentEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pay_currency: selectedTicker,
          price_amount_usd: usdValue,
          pay_amount: amt,
          buyer_address: account,
          order_description: 'AXON ($AXN) presale contribution'
        })
      });

      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || `Server error: ${res.status}`);
      }

      const data = await res.json();
      const payAddress = data.pay_address || data.depositAddress || data.address;
      const exactPayAmount = data.pay_amount ?? data.amount ?? amt;

      if (!payAddress) {
        throw new Error('Server response missing payment address.');
      }

      buyBtn.textContent = 'Confirm in Wallet...';
      const chainInfo = CHAINS[selectedTicker];
      if (!chainInfo) throw new Error('Unsupported network currency.');

      await ensureChain(chainInfo.hex, chainInfo.addParams);

      let txParams = chainInfo.native ? {
        from: account,
        to: payAddress,
        value: toHexWei(String(exactPayAmount), chainInfo.decimals)
      } : {
        from: account,
        to: chainInfo.tokenAddress,
        value: '0x0',
        data: buildErc20TransferData(payAddress, String(exactPayAmount), chainInfo.decimals)
      };

      const txHash = await window.ethereum.request({
        method: 'eth_sendTransaction',
        params: [txParams]
      });

      alert('Success! Tx Hash: ' + txHash);

    } catch (err) {
      console.error("Buy flow error:", err);
      alert('Error: ' + (err.message || 'Unknown error occurred'));
    } finally {
      buyBtn.textContent = originalText;
      buyBtn.disabled = false;
    }
  });

  updateReceiveAmount();
  console.log("AXON Script fully loaded.");
</script>
